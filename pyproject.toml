[project]
name = "tomato-detector"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "rfdetr[train,onnx]==1.12.1",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "opencv-python-headless",
    "pillow",
]

# CUDA build of PyTorch for training on the laptop GPU; CPU inference only needs onnxruntime.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
